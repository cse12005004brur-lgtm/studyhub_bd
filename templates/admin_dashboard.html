{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">অ্যাডমিন ড্যাশবোর্ড</h2>
        <a href="{% url 'add_note' %}" class="btn btn-success fw-bold">➕ নতুন নোট আপলোড</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>নোটের নাম</th>
                    <th>ক্লাস</th>
                    <th>বিষয়</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody>
                {% for note in notes %}
                <tr>
                    <td class="fw-bold">{{ note.title }}</td>
                    <td>{{ note.student_class }}</td>
                    <td>{{ note.subject }}</td>
                    <td>
                        <!-- এডিট এবং ডিলিট বাটন -->
                        <a href="{% url 'edit_note' note.id %}" class="btn btn-sm btn-warning">এডিট</a>

                        <a href="{% url 'delete_note' note.id %}" class="btn btn-sm btn-danger" onclick="return confirm('আপনি কি সত্যিই এই নোটটি ডিলিট করতে চান?')">ডিলিট</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">কোনো নোট আপলোড করা হয়নি!</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
