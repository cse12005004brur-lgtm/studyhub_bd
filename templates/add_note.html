{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm p-4">
                <h3 class="fw-bold mb-4 text-center">নতুন নোট আপলোড করুন</h3>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">নোটের নাম</label>
                        <input type="text" name="title" class="form-control" placeholder="নোটের নাম লিখুন" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">ক্লাস নির্বাচন করুন</label>
                        <select name="student_class" class="form-control" required>
                            <option value="">ক্লাস সিলেক্ট করুন</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10">Class 10</option>
                            <option value="Class 11">Class 11</option>
                            <option value="Class 12">Class 12</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">বিষয়</label>
                        <input type="text" name="subject" class="form-control" placeholder="যেমন: গণিত" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">বিবরণ</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="নোট সম্পর্কে কিছু লিখুন"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">পিডিএফ ফাইল</label>
                        <input type="file" name="pdf_file" class="form-control" accept=".pdf" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">আপলোড করুন</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'admin_dashboard' %}" class="text-decoration-none">← ড্যাশবোর্ডে ফিরে যান</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
