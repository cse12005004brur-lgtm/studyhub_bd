{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <div class="mb-3 text-primary display-4"><i class="fas fa-user-circle"></i></div>
                <h4 class="fw-bold">{{ user.first_name }}</h4>
                <p class="text-muted">{{ user.email }}</p>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-4">
                <h4 class="fw-bold mb-3">সংরক্ষিত (Favourite) নোটসমূহ</h4>
                <div class="list-group">
                    {% for note in favorite_notes %}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1 fw-bold">{{ note.title }}</h5>
                            <small class="text-muted">{{ note.student_class }} - {{ note.subject }}</small>
                        </div>
                        <a href="{{ note.pdf_file.url }}" class="btn btn-success btn-sm" download><i class="fas fa-download"></i></a>
                    </div>
                    {% empty %}
                    <p class="text-muted">আপনার কোনো নোট ফেভারিট করা নেই।</p>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
