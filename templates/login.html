{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <h3 class="text-center fw-bold mb-4">Login to StudyHub BD</h3>

                <form method="post">
                    {% csrf_token %}

                    {% if error %}
                        <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="আপনার ইউজারনেম লিখুন" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="পাসওয়ার্ড দিন" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
                </form>

                <p class="text-center mt-3 text-muted">একাউন্ট নেই? <a href="{% url 'register' %}">Register করুন</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
